<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nosso Player ❤️</title>

    <link rel="stylesheet" href="style.css">
    <!-- Link para os ícones do Font Awesome -->
    <script src="https://kit.fontawesome.com/fec10f46ff.js" crossorigin="anonymous"></script>
</head>

<body>

    <header>

        <h1>Arthur & Yasmin ❤️</h1>

        <p>
            2 meses de nós
        </p>

    </header>


    <main>

        <section id="player">

            <!-- Capa da música atual -->
            <div id="capa-musica">

                <!--
                    Correção: removido o src="capas_musicas/" (apontava para
                    uma pasta, não um arquivo, e gerava erro 404 no console).
                    O JavaScript deve definir o src real ao carregar cada música,
                    ex: imagemMusica.src = "capas_musicas/nome-da-capa.jpg";
                -->
                <img id="imagem-musica" src="" alt="Capa da música">

            </div>


            <!-- Informações da música -->
            <div id="informacoes-musica">

                <h2 id="titulo-musica">
                    Escolha uma música
                </h2>

                <p id="artista-musica">
                    Nossa playlist ❤️
                </p>

            </div>


            <!-- Barra de progresso -->
            <div id="barra-progresso">

                <span id="tempo-atual">
                    0:00
                </span>

                <!-- Correção: aria-label adicionado para leitores de tela -->
                <input type="range" id="progresso" min="0" max="100" value="0" aria-label="Progresso da música">

                <span id="duracao-musica">
                    0:00
                </span>

            </div>


            <!-- Controles do player -->
            <div id="controles">

                <button type="button" id="anterior" aria-label="Música anterior">
                    <i class="fa-solid fa-backward-step" aria-hidden="true"></i>
                </button>

                <!--
                    Correção: o ícone do play tem id próprio (#icone-play) para
                    o JavaScript trocar a classe entre "fa-play" e "fa-pause"
                    conforme a música toca/pausa, ex:
                    iconePlay.classList.toggle("fa-play");
                    iconePlay.classList.toggle("fa-pause");
                -->
                <button type="button" id="play" aria-label="Reproduzir música">
                    <i id="icone-play" class="fa-solid fa-play" aria-hidden="true"></i>
                </button>

                <button type="button" id="proxima" aria-label="Próxima música">
                    <i class="fa-solid fa-forward-step" aria-hidden="true"></i>
                </button>

            </div>

        </section>


        <section id="playlist">

            <h2>Nossa playlist 🎧</h2>

            <p>
                Um pouco de cada um de nós.
            </p>

            <div id="lista-musicas">

                <!--
                    O JavaScript vai colocar
                    as músicas aqui.
                -->

            </div>

        </section>

        <section id="mensagem"> <span class="mensagem-destaque"> ❤️ 02 meses ❤️ </span>
            <h2>Para você, Yasmin</h2>
            <div class="texto-mensagem">
                <p> <!-- Aqui entra a sua mensagem. Podemos dividir o texto em vários parágrafos para deixar a leitura mais agradável. --> </p>
                <p> <!-- Segundo parágrafo --> </p>
                <p> <!-- Terceiro parágrafo --> </p>
            </div>
            <div class="assinatura"> Com amor,<br> <strong>Arthur ❤️</strong> </div>
        </section>

    </main>


    <footer>

        <p>
            Feito com ❤️ para nós dois.
        </p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
